name: MackNa BTV ARM64 (staging only)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'mackna-btv/**'
      - '.github/workflows/mackna-btv-arm64.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'mackna-btv/**'
      - '.github/workflows/mackna-btv-arm64.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d scout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://scout:scout@127.0.0.1:5432/scout_test
      PGSSL: disable
      GUILD_ID: guild-test
      SESSION_SECRET: mackna-btv-ci-isolated-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and test application
        run: |
          npm ci
          npm test
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ARM64; publish only after merge to main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mackna-btv/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:mackna-btv-arm64
