name: Scout regression

on:
  pull_request:
    paths:
      - "src/scout.js"
      - "src/index.js"
      - "src/web.js"
      - "src/guildroster.js"
      - "src/telemetry.js"
      - "src/guildMight.js"
      - "src/ctatime.js"
      - "src/consolidation-state.js"
      - "src/killFame.js"
      - "src/season.js"
      - "src/db.js"
      - "src/commands.js"
      - "test/scout-regression.js"
      - "test/season-regression.js"
      - "test/presence-forces.js"
      - "test/scout-area-presence.js"
      - "test/combat-presence-cache.js"
      - "test/attendance-batch.js"
      - "test/locale-weapons.js"
      - "test/guild-roster.js"
      - "test/guild-roster-route.js"
      - "test/kill-fame.js"
      - "test/ingest-route.js"
      - "test/guild-might-discovery.js"
      - "test/guild-might-worker.js"
      - "test/pair-route.js"
      - "test/cta-time.js"
      - "test/cta-freeze.js"
      - ".github/workflows/scout-regression.yml"
  workflow_dispatch:

jobs:
  scout-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d scout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://scout:scout@127.0.0.1:5432/scout_test
      PGSSL: disable
      GUILD_ID: guild-test
      SESSION_SECRET: scout-regression-secret-fixed-for-ci
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: node --check em todos os src/*.js e test/*.js
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Scout regression em PostgreSQL temporário
        run: node test/scout-regression.js
      - name: Season regression em PostgreSQL temporário
        run: node test/season-regression.js
      - name: Presence forces
        run: node test/presence-forces.js
      - name: Scout area presence
        run: node test/scout-area-presence.js
      - name: Combat presence cache
        run: node test/combat-presence-cache.js
      - name: Attendance batch
        run: node test/attendance-batch.js
      - name: Locale weapons
        run: node test/locale-weapons.js
      - name: Guild roster
        run: node test/guild-roster.js
      - name: Guild roster route
        run: node test/guild-roster-route.js
      - name: Kill Fame
        run: node test/kill-fame.js
      - name: Telemetry ingest route
        run: node test/ingest-route.js
      - name: Guild Might discovery
        run: node test/guild-might-discovery.js
      - name: Guild Might worker e snapshots em Postgres
        run: node test/guild-might-worker.js
      - name: Telemetry pair security
        run: node test/pair-route.js
      - name: CTA time rollover
        run: node test/cta-time.js
      - name: CTA freeze persistence
        run: node test/cta-freeze.js
      - name: Prova negativa - pair sem consumo atômico emite vários tokens
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          node <<'NODE'
          const fs = require("fs");
          const path = "src/telemetry.js";
          let src = fs.readFileSync(path, "utf8");
          const pattern = /UPDATE albion_telemetry_pairing_codes\s+SET used_at=now\(\)\s+WHERE code_hash=\$1\s+AND used_at IS NULL\s+AND expires_at > now\(\)\s+RETURNING \*/m;
          const replacement = `SELECT * FROM albion_telemetry_pairing_codes
            WHERE code_hash=$1
              AND used_at IS NULL
              AND expires_at > now()
            LIMIT 1`;
          if (!pattern.test(src)) throw new Error("UPDATE atômico não encontrado");
          src = src.replace(pattern, replacement);
          fs.writeFileSync(path, src);
          NODE
          set +e
          node test/pair-route.js > mutation-pair-atomic.log 2>&1
          rc=$?
          set -e
          cat mutation-pair-atomic.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: pair-route não detectou consumo não atômico"
            exit 1
          fi
          grep -q "8 requisições simultâneas" mutation-pair-atomic.log
          echo "✅ prova negativa: corrida do /pair falha sem UPDATE atômico"

      - name: Prova negativa - pair perde limite por IP
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          sed -i 's/const PAIR_FAILURE_IP_LIMIT = 8;/const PAIR_FAILURE_IP_LIMIT = 100000;/' src/telemetry.js
          set +e
          node test/pair-route.js > mutation-pair-ip-limit.log 2>&1
          rc=$?
          set -e
          cat mutation-pair-ip-limit.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: pair-route não detectou ausência do limite por IP"
            exit 1
          fi
          grep -q "8ª falha do mesmo IP" mutation-pair-ip-limit.log
          echo "✅ prova negativa: /pair falha ao remover limite por IP"

      - name: Prova negativa - pair perde limite global
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          sed -i 's/const PAIR_FAILURE_GLOBAL_LIMIT = 300;/const PAIR_FAILURE_GLOBAL_LIMIT = 100000;/' src/telemetry.js
          set +e
          node test/pair-route.js > mutation-pair-global-limit.log 2>&1
          rc=$?
          set -e
          cat mutation-pair-global-limit.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: pair-route não detectou ausência do limite global"
            exit 1
          fi
          grep -q "limite global precisa bloquear" mutation-pair-global-limit.log
          echo "✅ prova negativa: /pair falha ao remover limite global"

      - name: Prova negativa - pair deixa client sobrescrever staff
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          sed -i 's/const boundPlayer = staffPlayer || playerName || null;/const boundPlayer = playerName || staffPlayer || null;/' src/telemetry.js
          set +e
          node test/pair-route.js > mutation-pair-binding.log 2>&1
          rc=$?
          set -e
          cat mutation-pair-binding.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: pair-route não detectou override do vínculo da staff"
            exit 1
          fi
          grep -q "nome vinculado pela staff precisa prevalecer" mutation-pair-binding.log
          echo "✅ prova negativa: /pair falha quando o client sobrescreve a staff"

      - name: Prova negativa - Railway trust proxy removido
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          sed -i '/app.set("trust proxy", 1);/d' src/web.js
          set +e
          node test/pair-route.js > mutation-trust-proxy.log 2>&1
          rc=$?
          set -e
          cat mutation-trust-proxy.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: pair-route não detectou perda do IP real atrás do Railway"
            exit 1
          fi
          echo "✅ prova negativa: rate limit falha sem trust proxy"

      - name: Prova negativa - ingest volta a aceitar NUL cru em device
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          node <<'NODE'
          const fs = require("fs");
          const path = "src/telemetry.js";
          let src = fs.readFileSync(path, "utf8");
          src = src.replace(
            '      const deviceId = stripTelemetryNul(device.deviceId).trim();\n      const detectedPlayer = stripTelemetryNul(device.playerName).trim();\n      const deviceVersion = stripTelemetryNul(device.version).trim();',
            '      const deviceId = String(device.deviceId || "").trim();\n      const detectedPlayer = String(device.playerName || "").trim();\n      const deviceVersion = String(device.version || "").trim();'
          );
          fs.writeFileSync(path, src);
          NODE
          set +e
          node test/pair-route.js > mutation-device-nul.log 2>&1
          rc=$?
          set -e
          cat mutation-device-nul.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: pair-route não detectou NUL cru em device.*"
            exit 1
          fi
          grep -q "NUL em device" mutation-device-nul.log
          echo "✅ prova negativa: ingest-route falha sem saneamento de device.*"

      - name: Prova negativa - applyReallocation ignora freeze
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          sed -i 's/if (isCtaFrozen(fresh)) {/if (false) {/' src/index.js
          set +e
          node test/cta-freeze.js > mutation-freeze-usage.log 2>&1
          rc=$?
          set -e
          cat mutation-freeze-usage.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: cta-freeze não detectou applyReallocation com checagem desligada"
            exit 1
          fi
          grep -q "applyReallocation precisa usar" mutation-freeze-usage.log
          echo "✅ prova negativa: cta-freeze falha quando applyReallocation usa if(false)"

      - name: Prova negativa - Kill Fame falha com escopo pós-resposta quebrado
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          node <<'NODE'
          const fs = require("fs");
          const path = "src/telemetry.js";
          let src = fs.readFileSync(path, "utf8");
          const before = src;
          src = src.replace(
            '      if (fameEnrichmentQueue?.length) {',
            '      if (missingFameEnrichmentQueue?.length) {'
          );
          if (src === before) throw new Error("mutação Kill Fame não aplicada");
          fs.writeFileSync(path, src);
          NODE
          set +e
          node test/ingest-route.js > mutation-ingest-killfame.log 2>&1
          rc=$?
          set -e
          cat mutation-ingest-killfame.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: ingest-route não detectou o bug de escopo pós-resposta"
            exit 1
          fi
          grep -q "missingFameEnrichmentQueue" mutation-ingest-killfame.log
          echo "✅ prova negativa: ingest-route falha ao quebrar o escopo pós-resposta"
      - name: Prova negativa - ingest malformado volta a derrubar o lote
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          node <<'NODE'
          const fs = require("fs");
          const path = "src/telemetry.js";
          let src = fs.readFileSync(path, "utf8");
          const before = src;
          src = src.replace(
            '  return String(value ?? "").replace(/\\u0000/g, "");',
            '  return String(value ?? "");'
          );
          src = src.replace(
            '  return Number.isFinite(parsed.getTime()) ? parsed.toISOString() : new Date().toISOString();',
            '  return value;'
          );
          src = src.replace(
            '          } catch (fastError) {\n            await client.query("ROLLBACK").catch(() => {});\n\n            // Fallback isolado:',
            '          } catch (fastError) {\n            await client.query("ROLLBACK").catch(() => {});\n            throw fastError;\n\n            // Fallback isolado:'
          );
          if (src === before) throw new Error("mutação do ingest malformado não aplicada");
          fs.writeFileSync(path, src);
          NODE
          set +e
          node test/ingest-route.js > mutation-malformed-ingest.log 2>&1
          rc=$?
          set -e
          cat mutation-malformed-ingest.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: ingest-route não detectou a regressão de lote fatal"
            exit 1
          fi
          echo "✅ prova negativa: ingest-route falha ao restaurar lote fatal sem saneamento/fallback"

      - name: Prova negativa - CTA perde trava sem persistência
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          node <<'NODE'
          const fs = require("fs");
          const path = "src/db.js";
          let src = fs.readFileSync(path, "utf8");
          const start = src.indexOf("async function markCtaFrozen");
          const end = src.indexOf("\n\nasync function setThread", start);
          if (start < 0 || end < 0) throw new Error("funções de persistência não encontradas");
          src = src.slice(0, start) +
            'async function markCtaFrozen() { return null; }\n\n' +
            'async function markConsolidationWarned() { return true; }' +
            src.slice(end);
          fs.writeFileSync(path, src);
          NODE
          set +e
          node test/cta-freeze.js > mutation-cta-freeze.log 2>&1
          rc=$?
          set -e
          cat mutation-cta-freeze.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: cta-freeze não detectou a perda de persistência"
            exit 1
          fi
          echo "✅ prova negativa: cta-freeze falha ao remover a persistência"

      - name: Prova negativa - CTA time falha com cálculo antigo
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/repo"
          cd "$tmp/repo"
          cat > src/ctatime.js <<'NODE'
          "use strict";
          function ctaPingTime(event) {
            const m = /^(\d{1,2}):(\d{2})$/.exec(String(event?.time_label || "").trim());
            if (!m) return null;
            const base = new Date(event.created_at);
            return new Date(Date.UTC(
              base.getUTCFullYear(),
              base.getUTCMonth(),
              base.getUTCDate(),
              Number(m[1]),
              Number(m[2]),
              0,
              0
            ));
          }
          module.exports = { ctaPingTime };
          NODE
          set +e
          node test/cta-time.js > mutation-cta-time.log 2>&1
          rc=$?
          set -e
          cat mutation-cta-time.log
          if [ "$rc" -eq 0 ]; then
            echo "ERRO: cta-time não detectou o cálculo antigo sem virada UTC"
            exit 1
          fi
          grep -q "2026-10-06T00:00:00.000Z" mutation-cta-time.log
          echo "✅ prova negativa: cta-time falha ao restaurar o cálculo antigo"
