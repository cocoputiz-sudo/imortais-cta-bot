name: MackNa isolated browser preview

on:
  pull_request:
    paths:
      - 'src/web.js'
      - 'test/mackna-visual-preview.cjs'
      - '.github/workflows/mackna-visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Browser dependency isolated from package lock
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile UI with synthetic responses
        env:
          QA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node test/mackna-visual-preview.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mackna-pr89-browser-preview
          path: artifacts/
          retention-days: 14
